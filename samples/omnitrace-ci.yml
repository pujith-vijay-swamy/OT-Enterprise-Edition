name: OmniTrace AI — Passive Contract Drift CI Gate

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  omnitrace-contract-check:
    name: AST Contract Drift & Blast Radius Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target PR Repository
        uses: actions/checkout@v4
        with:
          path: current-repo

      - name: Checkout Microservice Repositories for Mesh Cross-Matching
        uses: actions/checkout@v4
        with:
          repository: your-org/upstream-producer-service
          path: upstream-producer-service

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OmniTrace Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic uvicorn requests

      - name: Run OmniTrace CLI Extraction & Cross-Repo Match
        run: |
          python current-repo/engine/omnitrace/cli.py check \
            --dir-a ./upstream-producer-service \
            --dir-b ./current-repo \
            --strict-block

      - name: Post PR Comment on Contract Drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **OmniTrace AI Guardrail Blocked PR**: Detected breaking AST API contract drift! Please inspect route signatures and field schemas before merging.'
            })
